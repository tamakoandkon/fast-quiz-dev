version: 2
updates:
  - package-ecosystem: nuget
    directory: /FastQuiz
    schedule:
      interval: weekly
    # Keep EF and its database providers on one compatible major version.
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: [version-update:semver-major]
      - dependency-name: "Microsoft.Extensions.Diagnostics.HealthChecks.EntityFrameworkCore"
        update-types: [version-update:semver-major]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: [version-update:semver-major]
      - dependency-name: "Pomelo.EntityFrameworkCore.MySql"
        update-types: [version-update:semver-major]
    groups:
      ef-core:
        patterns: ["Microsoft.EntityFrameworkCore*", "Microsoft.Extensions.Diagnostics.HealthChecks.EntityFrameworkCore", "Npgsql.EntityFrameworkCore.PostgreSQL", "Pomelo.EntityFrameworkCore.MySql"]
  - package-ecosystem: npm
    directory: /FastQuiz.Frontend.Server
    schedule:
      interval: weekly
    groups:
      nuxt-vue:
        patterns: ["nuxt", "@nuxt/*", "vue", "vue-router", "pinia", "@pinia/*"]
  - package-ecosystem: npm
    directory: /LoadTest
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
