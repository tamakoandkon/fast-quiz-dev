# Include inside this application's nginx server block, not in unrelated sites.
# Nuxt emits .gz files at build time; nginx needs ngx_http_gzip_static_module.
gzip on;
gzip_static on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

# Keep existing hashed-asset caching and no-store rules for config.json.
# This deliberately does not alter listeners, TLS, upstreams, or other vhosts.
